<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SERA Cover</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-top: 8px solid #000000;
            border-bottom: 8px solid #000000;
            overflow: hidden;
        }
        .content-wrapper {
            padding-left: 0; /* Bleed off left margin */
            padding-right: 80px;
        }
        h1 {
            font-weight: 900;
            font-size: 240px;
            line-height: 0.8;
            color: #000000;
            margin-left: -20px; /* Bleed effect */
            margin-bottom: 40px;
            letter-spacing: -0.05em;
        }
        .subtitle {
            font-weight: 400;
            font-size: 48px;
            color: #333333;
            margin-left: 80px;
            margin-bottom: 24px;
            max-width: 900px;
        }
        .topic {
            font-weight: 400;
            font-size: 28px;
            color: #0033FF;
            margin-left: 80px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <h1>SERA</h1>
            <div class="subtitle">Your AI work memory that learns how you work</div>
            <div class="topic">Architecture, secure dashboard, vector RAG, and integrations</div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SERA Cover</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0B132B; /* Deep Navy */
            background-image: radial-gradient(circle at 50% 0%, #1C2A4A 0%, #0B132B 70%);
            font-family: 'Montserrat', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .content-wrapper {
            max-width: 1000px;
            padding: 40px;
            z-index: 2;
        }
        h1 {
            font-weight: 700;
            font-size: 120px;
            color: #FFFFFF;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .accent-line {
            width: 150px;
            height: 4px;
            background-color: #b9f36b; /* Lime Green Accent */
            margin: 0 auto 40px auto;
            box-shadow: 0 0 15px rgba(185, 243, 107, 0.6);
            border-radius: 2px;
        }
        .subtitle {
            font-weight: 400;
            font-size: 36px;
            color: #FFFFFF;
            margin-bottom: 24px;
            letter-spacing: 0.02em;
        }
        .tagline {
            font-weight: 300;
            font-size: 24px;
            color: #A0AABF;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }
        /* Decorative background elements */
        .glow-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(185, 243, 107, 0.05) 0%, rgba(11, 19, 43, 0) 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="glow-orb"></div>
        <div class="content-wrapper">
            <h1>SERA</h1>
            <div class="accent-line"></div>
            <div class="subtitle">The intelligent memory layer for your enterprise.</div>
            <div class="tagline">Transforming fragmented communication into actionable, automated workflows.</div>
        </div>
    </div>
</body>
</html>
